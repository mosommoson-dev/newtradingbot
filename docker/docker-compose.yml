services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5000:5000"
    volumes:
      - ../logs:/app/logs
      - ../reports:/app/reports
      - ../data/raw:/app/data/raw
      - ../data/processed:/app/data/processed
      - ../data/features:/app/data/features

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    command: python -m eurusd_quant_bot.dashboard.app
    depends_on:
      - postgres
    ports:
      - "5050:5000"

  postgres:
    image: timescale/timescaledb:latest-pg14
    environment:
      POSTGRES_DB: ${DB_NAME:-forex_bot}
      POSTGRES_USER: ${DB_USER:-trader}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trader}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    depends_on:
      - postgres
    volumes:
      - grafana:/var/lib/grafana

volumes:
  pgdata:
  redisdata:
  grafana:
