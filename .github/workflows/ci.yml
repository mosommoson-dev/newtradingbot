name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Slim install for CI: skip vectorbt + xgboost wheels that are heavy
          # and not needed for the unit-test layer.  The tests stub these out.
          pip install \
              "pandas>=2.1,<3.0" "numpy>=1.26,<2.1" "scipy>=1.11,<2.0" pyarrow \
              "scikit-learn>=1.3,<1.6" \
              yfinance requests \
              ta plotly flask jinja2 \
              python-dotenv loguru pydantic \
              optuna \
              "python-telegram-bot>=20.7,<22.0" \
              "ruff>=0.4" pytest pytest-asyncio pytest-cov

      - name: Ruff
        run: ruff check eurusd_quant_bot

      - name: Pytest
        run: pytest -q --cov=eurusd_quant_bot --cov-report=term-missing
