{% extends "_layout.html" %}
{% block title %}Risk{% endblock %}
{% block content %}
<div class="card">
    <h2>Risk envelope</h2>
    <table>
        <thead><tr><th>Parameter</th><th>Value</th></tr></thead>
        <tbody>
            {% for k, v in risk.items() %}
            <tr><td>{{ k }}</td><td>{{ v }}</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
