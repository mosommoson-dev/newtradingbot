<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>EUR/USD Quant Bot — {% block title %}Dashboard{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
        body { margin: 0; padding: 0 24px 32px 24px; background: #0e1117; color: #e6edf3; }
        header { display: flex; align-items: center; gap: 24px; padding: 16px 0;
                 border-bottom: 1px solid #21262d; margin-bottom: 24px; }
        header a { color: #58a6ff; text-decoration: none; }
        header a:hover { text-decoration: underline; }
        h1 { font-size: 18px; margin: 0; }
        nav { margin-left: auto; display: flex; gap: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #21262d; }
        th { background: #161b22; }
        .card { background: #161b22; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
        .stat { display: inline-block; margin-right: 24px; }
        .stat-label { color: #8b949e; font-size: 12px; text-transform: uppercase; }
        .stat-value { font-size: 20px; font-weight: 600; }
    </style>
</head>
<body>
<header>
    <h1>EUR/USD Quant Bot</h1>
    <nav>
        <a href="/">Overview</a>
        <a href="/trades">Trades</a>
        <a href="/risk">Risk</a>
        <a href="/settings">Settings</a>
        <a href="/health">/health</a>
    </nav>
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
